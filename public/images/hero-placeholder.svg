<svg viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium tech partnership illustration -->
  <rect width="600" height="450" fill="#F7F9FB"/>

  <!-- Subtle dot grid background -->
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#DDE2E9"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#dots)"/>

  <!-- Central device/dashboard mockup -->
  <g transform="translate(150, 80)">
    <!-- Browser/app window frame -->
    <rect x="0" y="0" width="300" height="200" rx="8" fill="#FFFFFF" stroke="#DDE2E9" stroke-width="2"/>
    <!-- Window header bar -->
    <rect x="0" y="0" width="300" height="28" rx="8" fill="#EDF0F4"/>
    <rect x="0" y="20" width="300" height="8" fill="#EDF0F4"/>
    <!-- Window controls -->
    <circle cx="16" cy="14" r="5" fill="#DDE2E9"/>
    <circle cx="34" cy="14" r="5" fill="#DDE2E9"/>
    <circle cx="52" cy="14" r="5" fill="#DDE2E9"/>

    <!-- Dashboard content - metrics -->
    <rect x="20" y="45" width="120" height="60" rx="4" fill="#F7F9FB"/>
    <rect x="30" y="55" width="60" height="8" rx="2" fill="#DDE2E9"/>
    <rect x="30" y="70" width="80" height="20" rx="2" fill="#16181C"/>

    <rect x="160" y="45" width="120" height="60" rx="4" fill="#F7F9FB"/>
    <rect x="170" y="55" width="50" height="8" rx="2" fill="#DDE2E9"/>
    <rect x="170" y="70" width="70" height="20" rx="2" fill="#515A66"/>

    <!-- Chart area -->
    <rect x="20" y="120" width="260" height="60" rx="4" fill="#F7F9FB"/>
    <!-- Chart bars -->
    <rect x="35" y="155" width="20" height="15" fill="#C4CBD5"/>
    <rect x="65" y="145" width="20" height="25" fill="#98A1AD"/>
    <rect x="95" y="140" width="20" height="30" fill="#636C79"/>
    <rect x="125" y="132" width="20" height="38" fill="#515A66"/>
    <rect x="155" y="128" width="20" height="42" fill="#16181C"/>
    <rect x="185" y="135" width="20" height="35" fill="#515A66"/>
    <rect x="215" y="142" width="20" height="28" fill="#636C79"/>
    <rect x="245" y="148" width="20" height="22" fill="#98A1AD"/>
  </g>

  <!-- Floating elements suggesting features/modules -->
  <!-- Top right card -->
  <g transform="translate(420, 60)">
    <rect width="140" height="80" rx="6" fill="#FFFFFF" stroke="#DDE2E9" stroke-width="1.5">
      <animate attributeName="y" values="0;-5;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="25" cy="25" r="12" fill="#16181C"/>
    <rect x="50" y="18" width="70" height="6" rx="2" fill="#DDE2E9"/>
    <rect x="50" y="30" width="50" height="6" rx="2" fill="#EDF0F4"/>
    <rect x="15" y="55" width="110" height="8" rx="2" fill="#EDF0F4"/>
  </g>

  <!-- Bottom left card -->
  <g transform="translate(40, 300)">
    <rect width="130" height="90" rx="6" fill="#FFFFFF" stroke="#DDE2E9" stroke-width="1.5"/>
    <rect x="15" y="15" width="100" height="6" rx="2" fill="#DDE2E9"/>
    <rect x="15" y="30" width="70" height="6" rx="2" fill="#EDF0F4"/>
    <!-- Checkmarks -->
    <circle cx="25" cy="55" r="8" fill="#16181C"/>
    <path d="M21 55 L24 58 L30 52" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="40" y="52" width="60" height="6" rx="2" fill="#DDE2E9"/>
    <circle cx="25" cy="75" r="8" fill="#98A1AD"/>
    <rect x="40" y="72" width="50" height="6" rx="2" fill="#EDF0F4"/>
  </g>

  <!-- Connection lines suggesting integration -->
  <path d="M170 300 Q200 280 220 250" stroke="#C4CBD5" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <path d="M420 140 Q400 160 380 180" stroke="#C4CBD5" stroke-width="2" stroke-dasharray="5,5" fill="none"/>

  <!-- Decorative elements -->
  <!-- Plus signs suggesting addition/growth -->
  <g fill="#DDE2E9">
    <path d="M520 320 h16 M528 312 v16" stroke="#C4CBD5" stroke-width="3" stroke-linecap="round"/>
    <path d="M80 120 h12 M86 114 v12" stroke="#DDE2E9" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Subtle circles suggesting connectivity -->
  <circle cx="540" cy="200" r="40" stroke="#EDF0F4" stroke-width="2" fill="none"/>
  <circle cx="540" cy="200" r="25" stroke="#DDE2E9" stroke-width="2" fill="none"/>
  <circle cx="540" cy="200" r="8" fill="#C4CBD5"/>
</svg>
